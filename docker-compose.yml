services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cadastra
      POSTGRES_PASSWORD: cadastra
      POSTGRES_DB: cadastra
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cadastra -d cadastra"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://cadastra:cadastra@db:5432/cadastra
      # Dev fallback only. Set a random 32+ char JWT_SECRET in any shared or real deployment.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
