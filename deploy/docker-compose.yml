# Production stack: Caddy (HTTPS) in front of the portal and the Core Engine.
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d --build
name: cadastra

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadastra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: cadastra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cadastra -d cadastra"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  api:
    build:
      context: ../backend
      target: prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cadastra:${POSTGRES_PASSWORD}@db:5432/cadastra
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      # Caddy and the portal sit on this network; trust their X-Forwarded-For so
      # sign-in throttling sees real client addresses.
      FORWARDED_ALLOW_IPS: 172.30.0.0/24
      WEB_CONCURRENCY: ${API_WORKERS:-2}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_BASEMAP_TILES: ${BASEMAP_TILES:-}
        NEXT_PUBLIC_BASEMAP_ATTRIBUTION: ${BASEMAP_ATTRIBUTION:-}
    restart: unless-stopped
    environment:
      CORE_API_URL: http://api:8000
    # One instance: refresh-token rotation is de-duplicated per process.
    depends_on: [api]
    networks: [internal]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN in deploy/.env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
